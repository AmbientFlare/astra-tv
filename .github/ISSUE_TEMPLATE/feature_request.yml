name: Feature request
description: Something Astra should do that it does not do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Astra is built for a remote and a couch, so the useful version of a
        request usually describes the moment it would help rather than the
        control it would need.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation on the TV, and what makes it awkward today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Astra to do?
  - type: textarea
    id: elsewhere
    attributes:
      label: Does another client do this well?
      description: Naming one is often the fastest way to explain a feature.
